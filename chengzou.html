<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>呈奏呈報表</title>
  <style>
    :root{
      --gold:#f2cf08;
      --red:#c90000;
      --deep-red:#a80000;
      --blue:#063dff;
      --ink:#111;
      --stage-w:1600px;
      --stage-h:900px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--gold);
      color:var(--ink);
      font-family:"DFKai-SB","BiauKai","KaiTi","標楷體",serif;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #stage{
      width:var(--stage-w);
      height:var(--stage-h);
      padding:28px 42px 20px;
      position:relative;
      transform-origin:center center;
      overflow:hidden;
      background:var(--gold);
    }

    .red{color:var(--red);font-weight:700}
    .blue{color:var(--blue);font-weight:700}

    .hero{
      height:176px;
      text-align:center;
    }

    .title{
      margin:0;
      color:var(--red);
      font-size:58px;
      line-height:1;
      letter-spacing:.88em;
      padding-left:.88em;
      font-weight:700;
    }

    .deity{
      margin-top:13px;
      font-size:27px;
      line-height:1.1;
    }

    .date-row{
      margin-top:14px;
      font-size:26px;
      line-height:1.2;
      white-space:nowrap;
      text-align:center;
    }

    .major-rule{
      position:relative;
      height:16px;
      border-top:3px solid var(--red);
      margin-top:10px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1.08fr .92fr;
      gap:38px;
      height:326px;
    }

    .section{
      min-width:0;
    }

    .section-head{
      display:flex;
      align-items:center;
      gap:10px;
      height:42px;
      margin-bottom:7px;
    }

    .section-badge{
      flex:0 0 auto;
      min-width:174px;
      padding:5px 18px 6px;
      border-radius:15px;
      background:var(--deep-red);
      border:2px solid var(--red);
      box-shadow:inset 0 0 0 2px #ffd962;
      color:#fff6b6;
      font-size:24px;
      line-height:1.05;
      text-align:center;
      font-weight:700;
      letter-spacing:.06em;
    }

    .section-head::after{
      content:"";
      height:2px;
      background:var(--red);
      flex:1;
    }

    .class-info{
      padding-right:10px;
    }

    .class-table,
    .stats-table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    .class-table{
      font-size:23px;
      line-height:1.30;
    }

    .class-table td{
      padding:4px 0;
      vertical-align:top;
    }

    .class-label{
      width:150px;
      white-space:nowrap;
      color:var(--ink);
    }

    .class-value{
      color:var(--blue);
      font-weight:700;
      word-break:keep-all;
      overflow-wrap:anywhere;
    }

    .stats{
      padding-left:28px;
      border-left:2px solid var(--red);
      position:relative;
    }

    .stats-table{
      font-size:24px;
      line-height:1.25;
    }

    .stats-table td{
      height:40px;
      padding:4px 3px;
      vertical-align:middle;
      white-space:nowrap;
    }

    .stats-label{width:150px}

    .num{
      color:var(--blue);
      font-weight:700;
      font-size:31px;
      display:inline-block;
      min-width:38px;
      text-align:center;
    }

    .courses{
      height:112px;
      margin-top:2px;
      overflow:hidden;
    }

    .courses .section-head{
      margin-bottom:1px;
    }

    .course-list{
      margin-left:205px;
      margin-top:-3px;
      display:grid;
      row-gap:1px;
    }

    .course-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 170px;
      gap:18px;
      align-items:baseline;
      font-size:23px;
      line-height:1.28;
      color:var(--blue);
      font-weight:700;
      max-width:930px;
    }

    .course-speaker{
      white-space:nowrap;
    }

    .notes{
      height:224px;
      overflow:hidden;
      position:relative;
      padding-bottom:42px;
    }

    .notes .section-head{
      margin-bottom:5px;
    }

    .leave-row{
      display:grid;
      grid-template-columns:92px 1fr;
      align-items:start;
      column-gap:8px;
      margin-bottom:4px;
    }

    .leave-label{
      font-size:21px;
      line-height:1.3;
      font-weight:700;
      white-space:nowrap;
    }

    .leave-grid{
      display:grid;
      grid-template-columns:repeat(10,minmax(0,1fr));
      gap:2px 9px;
      color:var(--blue);
      font-weight:700;
      font-size:17px;
      line-height:1.25;
      min-width:0;
    }

    .leave-item{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
    }

    .leave-empty{
      color:var(--ink);
      font-weight:400;
      font-size:19px;
    }

    .signature{
      position:absolute;
      right:6px;
      bottom:4px;
      font-size:24px;
      line-height:1;
      white-space:nowrap;
      text-align:right;
    }

    #source-status{
      position:absolute;
      left:12px;
      bottom:8px;
      font-family:Arial,"Noto Sans TC",sans-serif;
      font-size:13px;
      color:#333;
      background:rgba(255,255,255,.58);
      border:1px solid rgba(0,0,0,.16);
      border-radius:10px;
      padding:4px 9px;
      user-select:none;
      z-index:20;
    }

    #source-status.ok{ color:#075f1d; }
    #source-status.err{ color:#9a1111; }

    @media(max-aspect-ratio:16/9){
      /* scaling handled by JS */
    }
  </style>
</head>

    function txt(v){
      return v == null ? "" : String(v).trim();
    }

    const CELL_MAP = {
      deity: "A3",
      ganzhi: "B4",
      year: "D4",
      month: "D5",
      day: "D6",
      days: "D7",
      className: "C8",
      organizerRaw: "C9",
      supervisor: "C10",
      mainLeader: "C11",
      leaders1: "C12",
      leaders2: "C13",
      studentM: "C14",
      studentF: "C15",
      studentT: "C16",
      leaderM: "C18",
      leaderF: "C19",
      leaderT: "C20",
      insideM: "C22",
      insideF: "C23",
      outsideM: "C25",
      outsideF: "C26",
      totalM: "C28",

      grandTotal: "C31",
      signer: "C33",
      sick: "C36",
      personal: "C37",
      courses: "C39"
    };

    function getSingleCellJsonp(a1){
      return new Promise((resolve,reject)=>{
        const callbackName = "__sheetCell_" + a1.replace(/[^A-Z0-9]/gi,"_") + "_" + Date.now() + "_" + Math.floor(Math.random()*100000);
        const script = document.createElement("script");

        const timeout = setTimeout(()=>{
          cleanup();
          reject(new Error("讀取 " + a1 + " 逾時"));
        },10000);

        function cleanup(){
          clearTimeout(timeout);
          try{ delete window[callbackName]; }catch(e){ window[callbackName] = undefined; }
          if(script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(json){
          cleanup();
          try{
            const rows = json && json.table && json.table.rows ? json.table.rows : [];
            const cell = rows[0] && rows[0].c ? rows[0].c[0] : null;
            if(!cell){
              resolve("");
              return;
            }
            const value = cell.f != null ? cell.f : cell.v;
            resolve(value == null ? "" : String(value).trim());
          }catch(err){
            reject(err);
          }
        };

        script.onerror = function(){
          cleanup();
          reject(new Error("讀取 " + a1 + " 失敗"));
        };

        script.src =
          "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
          "/gviz/tq?tqx=out:json;responseHandler:" + callbackName +
          "&gid=" + SHEET_GID +
          "&range=" + encodeURIComponent(a1) +
          "&headers=0&_=" + Date.now();

        document.head.appendChild(script);
      });
    }

    async function readLiveSheetData(){
      const entries = Object.entries(CELL_MAP);
      const values = await Promise.all(
        entries.map(async ([key,a1]) => [key, await getSingleCellJsonp(a1)])
      );

      const raw = Object.fromEntries(values);

      return {
        deity: raw.deity,
        ganzhi: raw.ganzhi,
        year: raw.year,
        month: raw.month,
        day: raw.day,
        days: raw.days,
        className: raw.className,
        organizer: raw.organizerRaw ? ("寶光崇正 " + raw.organizerRaw).trim() : "",
        supervisor: raw.supervisor,
        mainLeader: raw.mainLeader,
        leaders: [raw.leaders1,raw.leaders2].filter(Boolean).join("\n"),
        studentM: raw.studentM,
        studentF: raw.studentF,
        studentT: raw.studentT,
        leaderM: raw.leaderM,
        leaderF: raw.leaderF,
        leaderT: raw.leaderT,
        insideM: raw.insideM,
        insideF: raw.insideF,
        outsideM: raw.outsideM,
        outsideF: raw.outsideF,
        totalM: raw.totalM,
        totalF: raw.totalF,
        grandTotal: raw.grandTotal,
        signer: raw.signer,
        sick: raw.sick,
        personal: raw.personal,
        courses: raw.courses
      };
    }

    function setText(id,value){
      const el = document.getElementById(id);
      if(el) el.textContent = value || "";
    }

    function parseLeave(raw){
      if(!raw || !raw.trim()) return [];
      return raw
        .replace(/\r/g,"")
        .split(/\n+/)
        .map(line => line.trim())
        .filter(Boolean)
        .map(line => {
          const parts = line.split(/\t+/).map(s=>s.trim()).filter(Boolean);
          if(parts.length >= 3) return parts[0] + " " + parts[1] + " " + parts.slice(2).join(" ");
          return line.replace(/\s{2,}/g," ");
        });
    }

    function renderLeave(id,raw){
      const el = document.getElementById(id);
      el.innerHTML = "";
      const items = parseLeave(raw);

      if(!items.length){
        const empty = document.createElement("div");
        empty.className = "leave-empty";
        empty.textContent = "—";
        el.appendChild(empty);
        return;
      }

      const count = items.length;
      const cols = count > 70 ? 11 : count > 55 ? 10 : count > 40 ? 9 : count > 24 ? 8 : 6;
      const size = count > 70 ? 15.5 : count > 55 ? 16.5 : count > 40 ? 17 : 18;
      el.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0,1fr))";
      el.style.fontSize = size + "px";

      items.forEach(item=>{
        const div = document.createElement("div");
        div.className = "leave-item";
        div.textContent = item;
        el.appendChild(div);
      });
    }

    function splitTitleSpeaker(line){
      line = line.trim();
      if(!line) return null;
      const parts = line.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean);
      if(parts.length >= 2){
        return {title:parts[0], speaker:parts.slice(1).join(" ")};
      }
      return {title:line,speaker:""};
    }

    function parseCourses(raw){
      if(!raw || !raw.trim()) return [];
      const base = raw.replace(/\r/g,"").split(/\n+/).map(s=>s.trim()).filter(Boolean);
      const out = [];

      base.forEach(line=>{
        const q = line.indexOf("？");
        if(q >= 0 && q < line.length-1){
          const first = line.slice(0,q+1).trim();
          const rest = line.slice(q+1).trim();
          const a = splitTitleSpeaker(first);
          const b = splitTitleSpeaker(rest);
          if(a) out.push(a);
          if(b) out.push(b);
        }else{
          const item = splitTitleSpeaker(line);
          if(item) out.push(item);
        }
      });

      for(let i=0;i<out.length;i++){
        if(!out[i].speaker){
          const next = out.slice(i+1).find(x=>x.speaker);
          if(next && next.speaker === "各地幹部") out[i].speaker = next.speaker;
        }
      }
      return out;
    }

    function renderCourses(raw){
      const el = document.getElementById("courseList");
      el.innerHTML = "";
      const rows = parseCourses(raw);

      rows.forEach(item=>{
        const row = document.createElement("div");
        row.className = "course-row";

        const title = document.createElement("div");
        title.textContent = item.title;

        const speaker = document.createElement("div");
        speaker.className = "course-speaker";
        speaker.textContent = item.speaker;

        row.appendChild(title);
        row.appendChild(speaker);
        el.appendChild(row);
      });
    }

    function render(data){
      [
        "deity","ganzhi","year","month","day","days","className","organizer",
        "supervisor","mainLeader","leaders","studentM","studentF","studentT",
        "leaderM","leaderF","leaderT","insideM","insideF","outsideM","outsideF",

      renderCourses(data.courses);
      renderLeave("sickList",data.sick);
      renderLeave("personalList",data.personal);
      fitStage();
    }

    function fitStage(){
      const stage = document.getElementById("stage");
      stage.style.transform = "scale(1)";
      const scale = Math.min(
        window.innerWidth / stage.offsetWidth,
        window.innerHeight / stage.offsetHeight
      ) * .995;
      stage.style.transform = "scale(" + scale + ")";
    }

    let sheetRefreshTimer = null;

    function setSourceStatus(text,type){
      const status = document.getElementById("source-status");
      status.textContent = text;
      status.className = type || "";
    }

    async function refreshFromSheet(){
      setSourceStatus("● 正在同步 Google Sheet…","");
      try{
        const live = await readLiveSheetData();

        if(!live.className){
          throw new Error("班名 C8 為空白");
        }

        render({...FALLBACK_DATA,...live});

        const now = new Date();
        const hh = String(now.getHours()).padStart(2,"0");
        const mm = String(now.getMinutes()).padStart(2,"0");
        const ss = String(now.getSeconds()).padStart(2,"0");

        setSourceStatus("● Sheet 已同步 " + hh + ":" + mm + ":" + ss,"ok");
      }catch(err){
        console.error("Sheet sync failed:",err);
        setSourceStatus("⚠ Sheet 同步失敗｜顯示備用資料","err");
      }
    }

    render(FALLBACK_DATA);
    refreshFromSheet();
    sheetRefreshTimer = setInterval(refreshFromSheet,30000);
    window.addEventListener("resize",fitStage);
  </script>
</body>
</html>
