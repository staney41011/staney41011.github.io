<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Display Web</title>
    <style type="text/css">
        /* 嚴格重置邊距，並將畫布鎖死在螢幕可視範圍內 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* 關鍵：完全禁止外層網頁出現捲軸 */
            background-color: #ffffff;
        }

        /* 讓 iframe 絕對填滿外層容器，不留邊框與縫隙 */
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <iframe src="https://script.google.com/macros/s/AKfycbwKrwYW1K4mKH4ZwrO0FnHIzIGS72hmTDaioqbwIQHjpTRYhNxHd2C0Fw12csEBVqPE/exec" frameborder="0" allowfullscreen></iframe>
</body>
</html>
